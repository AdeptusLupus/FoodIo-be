name: Check Jira Code in Commits and Update PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch commit messages in PR
        id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          echo "🔍 Fetching commits for PR #${{ github.event.pull_request.number }}"
          gh pr view ${{ github.event.pull_request.number }} --json commits --jq '.commits[].messageHeadline' > commits.txt || true
          echo "✅ Commits fetched:"
          if [ -s commits.txt ]; then cat commits.txt; else echo "(no commits found)"; fi

      - name: Validate Jira IDs and Build Markdown Summary
        id: jira
        shell: bash
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -eo pipefail

          echo "🚀 Starting Jira validation..."

          # Defensive: check environment
          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_USER" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "❌ Missing Jira credentials or base URL environment variables."
            exit 1
          fi

          # Defensive: check commit file
          if [ ! -f commits.txt ]; then
            echo "⚠️ commits.txt not found — likely no commits or PR access issue."
            {
              echo "summary<<EOF"
              echo "### 🧾 Commits and Related Jira Issues\n\n_No commits found._"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JIRA_REGEX='[A-Z]{2,}-[0-9]+'
          FAIL=0
          SUMMARY="### 🧾 Commits and Related Jira Issues\n\n"
          declare -A SEEN
          COUNT=0

          safe_curl() {
            local ID=$1
            local HTTP
            set +e
            HTTP=$(curl -s -o /tmp/jira.json -w "%{http_code}" -u "$JIRA_USER:$JIRA_API_TOKEN" "$JIRA_BASE_URL/rest/api/3/issue/$ID")
            local STATUS=$?
            set -e
            if [ $STATUS -ne 0 ]; then
              echo "000"
              return
            fi
            echo "$HTTP"
          }

          while IFS= read -r line || [ -n "$line" ]; do
            CLEAN_LINE=$(echo "$line" | tr -d '\r' | xargs)
            [ -z "$CLEAN_LINE" ] && continue
            ((COUNT++))
            echo "🔹 Commit #$COUNT: $CLEAN_LINE"

            IDS=$(echo "$CLEAN_LINE" | grep -Eo "$JIRA_REGEX" || true)
            if [ -z "$IDS" ]; then
              echo "❌ Commit missing Jira ID: $CLEAN_LINE"
              FAIL=1
              continue
            fi

            for ID in $IDS; do
              if [[ -n "${SEEN[$ID]:-}" ]]; then
                echo "ℹ️ Skipping already validated Jira ID: $ID"
                continue
              fi

              echo "🔍 Checking Jira issue: $ID"
              RESPONSE=$(safe_curl "$ID" || echo "000")
              echo "🔹 Jira response: $RESPONSE"

              if [ "$RESPONSE" != "200" ]; then
                echo "⚠️ Jira issue $ID not found or inaccessible (HTTP $RESPONSE)"
              else
                echo "✅ Jira issue $ID is valid"
              fi

              SUMMARY+="- [${ID}](${JIRA_BASE_URL}/browse/${ID}) — ${CLEAN_LINE}\n"
              SEEN[$ID]=1
            done
          done < commits.txt

          echo "✅ Processed $COUNT commits"
          echo -e "$SUMMARY"

          {
            echo "summary<<EOF"
            echo -e "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ $FAIL -eq 1 ]; then
            echo "❌ Some commits are missing Jira IDs."
            exit 1
          fi

      - name: Update PR description with Jira summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          echo "📝 Updating PR description..."
          BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body -q .body || echo "")
          CLEAN_BODY=$(echo "$BODY" | sed '/### 🧾 Commits and Related Jira Issues/,$d')
          SUMMARY="${{ steps.jira.outputs.summary }}"
          SUMMARY="${SUMMARY:-}"  # default empty if unset
          UPDATED_BODY="${CLEAN_BODY}\n\n${SUMMARY}"
          echo -e "$UPDATED_BODY" | gh pr edit ${{ github.event.pull_request.number }} --body - || echo "⚠️ Failed to update PR body, continuing..."

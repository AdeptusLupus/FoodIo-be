name: Check Jira Code in Commits and Update PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch commit messages in PR
        id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Fetching commits for PR #${{ github.event.pull_request.number }}"

          # This ensures no pagination/truncation
          gh pr view ${{ github.event.pull_request.number }} \
            --json commits --jq '.commits[].oid + " " + .commits[].messageHeadline' > commits.txt || true

          echo "✅ Commit messages fetched:"
          cat commits.txt || echo "(no commits found)"

      - name: Validate Jira IDs and Build Markdown Summary
        id: jira
        shell: bash
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -e
          JIRA_REGEX='[A-Z]{2,}-[0-9]+'
          FAIL=0
          SUMMARY="### 🧾 Commits and Related Jira Issues\n\n"
          declare -A SEEN
          COUNT=0

          while IFS= read -r line; do
            CLEAN_LINE=$(echo "$line" | tr -d '\r' | xargs)
            [ -z "$CLEAN_LINE" ] && continue
            ((COUNT++))

            IDS=$(echo "$CLEAN_LINE" | grep -Eo "$JIRA_REGEX" || true)
            if [ -z "$IDS" ]; then
              echo "❌ Commit missing Jira ID: $CLEAN_LINE"
              FAIL=1
              continue
            fi

            for ID in $IDS; do
              if [[ -n "${SEEN[$ID]}" ]]; then
                continue
              fi

              echo "🔍 Validating Jira issue: $ID"
              RESPONSE=$(curl -s -u "$JIRA_USER:$JIRA_API_TOKEN" \
                -w "%{http_code}" -o /tmp/jira.json \
                "$JIRA_BASE_URL/rest/api/3/issue/$ID")

              if [ "$RESPONSE" != "200" ]; then
                echo "❌ Jira issue $ID not found (HTTP $RESPONSE)"
                FAIL=1
                continue
              fi

              SUMMARY+="- [${ID}](${JIRA_BASE_URL}/browse/${ID}) — ${CLEAN_LINE}\n"
              SEEN[$ID]=1
            done
          done < commits.txt

          echo "Total commits processed: $COUNT"
          echo -e "$SUMMARY"

          if [ $FAIL -eq 1 ]; then
            echo "❌ Some commits are missing valid Jira IDs."
            exit 1
          fi

          if [ $COUNT -eq 0 ]; then
            echo "⚠️ No commits found in PR."
            exit 0
          fi

          {
            echo "summary<<EOF"
            echo -e "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR description with Jira summary
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body -q .body)
          CLEAN_BODY=$(echo "$BODY" | sed '/### 🧾 Commits and Related Jira Issues/,$d')
          SUMMARY="${{ steps.jira.outputs.summary }}"
          UPDATED_BODY="${CLEAN_BODY}\n\n${SUMMARY}"
          echo -e "$UPDATED_BODY" | gh pr edit ${{ github.event.pull_request.number }} --body -

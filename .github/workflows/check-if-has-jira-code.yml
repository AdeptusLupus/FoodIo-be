name: Check Jira Code in Commits

on:
    pull_request:
        types: [opened, synchronize, reopened, edited]

jobs:
    check-commits:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Get all commit messages in PR
              id: commits
              run: |
                  COMMITS=$(gh pr view ${{ github.event.pull_request.number }} --json commits -q ".commits[].message")
                  echo "$COMMITS" > commits.txt

            - name: Check commit messages for Jira code
              run: |
                  JIRA_REGEX='[A-Z]{2,}-[0-9]+'
                  FAIL=0
                  while IFS= read -r line; do
                    if ! [[ $line =~ $JIRA_REGEX ]]; then
                      echo "❌ Commit message missing Jira code: $line"
                      FAIL=1
                    fi
                  done < commits.txt
                  if [ $FAIL -eq 1 ]; then
                    echo "Some commits are missing Jira codes."
                    exit 1
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
